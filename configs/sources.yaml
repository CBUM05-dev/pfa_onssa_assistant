sources:
  - name: onssa
    base_url: https://www.onssa.gov.ma/
    seed_urls:
      - https://www.onssa.gov.ma/
      - https://www.onssa.gov.ma/onssa/a-propos-de-lonssa/
      - https://www.onssa.gov.ma/missions/
      - https://www.onssa.gov.ma/organisation/
      - https://www.onssa.gov.ma/prestations-payantes/
      - https://www.onssa.gov.ma/oeuvres-sociales/
      - https://www.onssa.gov.ma/contact/
      - https://www.onssa.gov.ma/glossaire/
    allowed_domains:
      - www.onssa.gov.ma
      - onssa.gov.ma
    max_depth: 2
    include_url_patterns:
      - regulation
      - reglementation
      - réglementation
      - securite
      - sécurité
      - sanitaire
      - aliment
      - aliments
      - denrees
      - denrées
      - onssa
      - missions
      - organisation
      - prestations
      - oeuvres-sociales
      - contact
      - glossaire
      - pdf
    exclude_url_patterns:
      - facebook.com
      - twitter.com
      - x.com
      - linkedin.com
      - youtube.com
      - instagram.com
    pages_dir: data/raw/pages/onssa
    pdfs_dir: data/raw/pdfs/onssa
    images_dir: data/raw/images/onssa
    manifest_path: data/sources/onssa_manifest.json
    preserve_url_paths: true
    verify_ssl: false
    request_timeout_seconds: 30
    user_agent: ONSSA-AI-Service-SourceSync/0.1
