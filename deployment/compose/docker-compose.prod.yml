services:
  api:
    build:
      context: ../..
      dockerfile: deployment/docker/Dockerfile.api
    restart: unless-stopped
    env_file:
      - ../../.env
    volumes:
      - ../../configs:/app/configs:ro
      - ../../data:/app/data
    depends_on:
      - qdrant
      - vllm

  vllm:
    build:
      context: ../..
      dockerfile: deployment/docker/Dockerfile.vllm
    restart: unless-stopped
    ipc: host
    volumes:
      - ../../data/models:/models
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  qdrant:
    image: qdrant/qdrant:v1.10.1
    restart: unless-stopped
    volumes:
      - qdrant_storage:/qdrant/storage

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../nginx/onssa-ai.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api

volumes:
  qdrant_storage:
