services:
  api:
    build:
      context: ../..
      dockerfile: deployment/docker/Dockerfile.api
    env_file:
      - ../../.env.example
    ports:
      - "8000:8000"
    volumes:
      - ../../configs:/app/configs:ro
      - ../../data:/app/data
    depends_on:
      - qdrant

  qdrant:
    image: qdrant/qdrant:v1.18.0
    ports:
      - "6333:6333"
    volumes:
      - qdrant_storage:/qdrant/storage

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama

volumes:
  qdrant_storage:
  ollama_models:
