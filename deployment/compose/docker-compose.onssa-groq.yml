services:
  api:
    build:
      context: ../..
      dockerfile: deployment/docker/Dockerfile.api
    restart: unless-stopped
    env_file:
      - ../../.env
    volumes:
      - ../../configs:/app/configs:ro
      - ../../data:/app/data
    extra_hosts:
      - "www.onssa.gov.ma:192.168.5.20"
      - "onssa.gov.ma:192.168.5.20"
    depends_on:
      - qdrant

  qdrant:
    image: qdrant/qdrant:v1.18.0
    restart: unless-stopped
    volumes:
      - qdrant_storage:/qdrant/storage

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ../nginx/onssa-ai.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api

volumes:
  qdrant_storage:
